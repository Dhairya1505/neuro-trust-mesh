services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neurotrust
      POSTGRES_PASSWORD: neurotrust
      POSTGRES_DB: neurotrust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurotrust"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent_registry:
    build:
      context: .
      dockerfile: services/agent_registry/Dockerfile
    restart: on-failure:5
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      POSTGRES_DSN: postgresql+asyncpg://neurotrust:neurotrust@postgres:5432/neurotrust
    ports:
      - "8001:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  cdt_service:
    build:
      context: .
      dockerfile: services/cdt_service/Dockerfile
    restart: on-failure:5
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
