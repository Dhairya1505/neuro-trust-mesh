[project]
name = "neurotrust-common"
version = "0.1.0"
description = "Shared event bus, logging, schemas, and DB helpers for NeuroTrust Mesh services"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.4",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurotrust_common*"]
